# Seeded metro station envelope (metro.py). Each MetroConfig field left at None is drawn from the seed
# within these ranges; explicit MetroConfig(...) arguments and CLI flags win. Ranges are [low, high], metres.
# Every value is drawn in a fixed order, so changing one range never shifts the others.

[metro.envelope]
cars = [4, 8]                         # train length in cars
car_lengths = [15.0, 16.5, 18.0]      # one is chosen per station
stopping_margin = 5.0                 # added to the train length
max_platform = 140.0                  # cap (keeps the concourse storey under 200,000 triangles)
depth = [6.0, 12.0]                   # concourse floor to platform floor
concourse_height = [4.5, 7.0]
column_spacing = [7.5, 10.5]
room_depth = [4.0, 6.5]               # side rooms
stair_width = [2.4, 3.4]              # clear
island_width = [8.0, 12.0]            # always >= stair width + 4.5 m
side_width = [5.5, 7.5]               # always >= stair width + 2.3 m
ballast_probability = 0.3             # else a concrete slab track
ramp_probability = 0.5                # spiral ramp shaft at the west end
palettes = ["blue", "cream_red", "green", "grey_amber", "ochre", "white_teal"]
